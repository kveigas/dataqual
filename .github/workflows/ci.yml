name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-groups --locked
      - run: uv run ruff check backend scripts
      - run: uv run ruff format --check backend scripts
      - run: uv run pyright
      - run: uv run pytest --cov --cov-branch --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v5
        with:
          version: "11.16.0"
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir frontend typecheck
      - run: pnpm --dir frontend build
      - run: pnpm --dir frontend test:unit
      - run: pnpm --dir frontend exec playwright install --with-deps chromium
      - run: pnpm --dir frontend test:e2e

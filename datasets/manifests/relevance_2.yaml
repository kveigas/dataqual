  - "Most items have five annotations, but 11,888 items have fewer than five. This is incomplete coverage, not null-valued annotation rows."
  - "Ground truth covers only 10,079 of 99,319 annotated items."
  - "Three worker-item connected components exist; component-aware Dawid-Skene eligibility rules are required."
  - "The pre-registered split exposes inadequate gold/worker overlap for the locked weighted-vote threshold. Do not lower the threshold after observing this result; restrict weighted-vote evaluation to simulation or pre-register a better-suited licensed dataset."
